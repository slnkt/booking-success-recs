<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Успешный экран записи — витамины (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1098D4;
  --blue-light:#63BCE3;
  --dark:#05131A;
  --muted:#8CA0AC;
  --bg:#F1F4F6;
  --accent-bg:#EDF8FC;
  --green:#27AE60;
  --error:#d10714;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Montserrat",Arial,Helvetica,sans-serif;
  font-size:14px;color:var(--dark);
  background:var(--bg);
  min-height:100vh;
}
button{font-family:inherit}
[hidden]{display:none !important}

.wrap{max-width:560px;margin:0 auto;padding:14px 12px 60px}
.shell{
  background:#fff;border-radius:26px;border:1px solid #ECEFF2;
  padding:22px 20px;margin-bottom:14px;
}

/* ---------- header ---------- */
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo-chip{background:#CBE9F8;border-radius:16px;padding:13px 16px;display:flex}
.logo-chip svg{height:15px;width:auto;fill:var(--blue)}
.hd-right{display:flex;gap:10px}
.icon-btn{
  width:44px;height:44px;border-radius:50%;background:#F0F2F4;border:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
}
.badge{
  position:absolute;top:-3px;right:-3px;
  min-width:19px;height:19px;border-radius:10px;padding:0 5px;
  background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- success ---------- */
.success{text-align:center;margin-bottom:20px}
.s-check{
  width:56px;height:56px;border-radius:50%;background:var(--green);
  margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
}
.success h1{font-size:20px;font-weight:600}

/* ---------- mail note ---------- */
.mailnote{
  display:flex;align-items:center;gap:10px;
  background:#EAF6FC;border-radius:14px;padding:14px 16px;
  font-size:13px;line-height:1.4;
}
.mailnote svg{flex:none}

.lk-btn{
  width:100%;background:#F0F2F4;border:0;border-radius:14px;
  padding:15px;font-size:14px;font-weight:600;color:var(--dark);
  cursor:pointer;margin-top:14px;
}

/* ---------- showcase ---------- */
.recs{background:var(--accent-bg);border-radius:16px;padding:16px 14px;margin-top:14px}
.recs-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.recs-head h3{font-size:15px;font-weight:600}
.recs-link{font-size:12.5px;font-weight:600;color:var(--blue);text-decoration:none;white-space:nowrap}
.rail{
  display:flex;gap:8px;overflow-x:auto;
  scroll-snap-type:x mandatory;
  margin:0 -14px;padding:0 14px 4px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.p-card{
  width:146px;flex:none;background:#fff;border-radius:14px;padding:10px;
  scroll-snap-align:start;display:flex;flex-direction:column;
}
.p-img{
  height:92px;border-radius:10px;background:var(--accent-bg);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.p-inb{
  position:absolute;top:6px;left:6px;
  background:var(--blue);color:#fff;font-size:10px;font-weight:700;
  border-radius:6px;padding:3px 6px;
}
.p-name{font-size:12px;font-weight:600;line-height:1.35;margin:8px 0 2px;flex:1}
.p-price{font-size:13.5px;font-weight:700;margin-bottom:8px}
.p-btn{
  border:0;border-radius:9px;padding:9px;font-size:12px;font-weight:600;color:#fff;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));cursor:pointer;
}
.p-btn:active{opacity:.85}

/* ---------- promo footer ---------- */
.promo{background:#E9EEF1;text-align:center;padding:46px 20px;border:0}
.promo h2{
  font-size:23px;font-weight:600;line-height:1.35;margin-bottom:24px;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;
}
.promo h2 svg{height:20px;width:auto;fill:var(--dark);position:relative;top:2px}
.socials{display:flex;gap:10px;justify-content:center}
.soc{
  width:44px;height:44px;border-radius:12px;background:#fff;
  display:flex;align-items:center;justify-content:center;
}

.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;border:0;border-radius:12px;padding:15px 20px;
  font-size:14px;font-weight:600;color:#fff;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));
  cursor:pointer;transition:opacity .15s;
}
.btn:active{opacity:.85}

/* ---------- cart (мок) ---------- */
.cart{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto}
.cart-inner{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.cart-back{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:500;color:var(--blue);
  background:none;border:0;cursor:pointer;padding:6px 0;margin-bottom:8px;
}
.cart h2{font-size:24px;font-weight:600;margin-bottom:18px}
.cart-item{
  background:#fff;border-radius:16px;padding:16px;
  display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;
}
.cart-item .ci-im{flex:none;width:52px;height:66px;background:#F4F6F8;border-radius:10px;display:flex;align-items:center;justify-content:center}
.cart-item .ci-im svg{height:54px;width:auto}
.cart-item .ci-info{flex:1;min-width:0}
.ci-caps{font-size:12px;color:var(--muted);margin-top:2px}
.cart-sum{background:#fff;border-radius:16px;padding:16px;margin-top:14px}
.cart-sum h3{font-size:14.5px;font-weight:600;margin-bottom:10px}
.cs-row{display:flex;justify-content:space-between;font-size:13px;color:#5c6d78;margin-bottom:7px}
.cs-row:last-child{margin-bottom:0}
.ci-name{font-size:14px;font-weight:600;line-height:1.35}
.ci-src{
  display:inline-block;font-size:11px;font-weight:600;color:var(--blue);
  background:var(--accent-bg);border-radius:6px;padding:3px 8px;margin-top:6px;
}
.ci-qty{font-size:12.5px;color:var(--muted);margin-top:6px}
.ci-price{font-size:14px;font-weight:600;white-space:nowrap}
.cart-total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:16px 4px 14px;font-size:15px;
}
.cart-total b{font-size:20px;font-weight:700}

/* ---------- proto panel ---------- */
.fab{
  position:fixed;right:14px;bottom:20px;z-index:70;
  background:var(--dark);color:#fff;border:0;border-radius:24px;
  padding:11px 16px;font-size:12.5px;font-weight:600;
  cursor:pointer;box-shadow:0 6px 18px rgba(5,19,26,.3);
}
.panel{
  position:fixed;right:14px;bottom:70px;z-index:70;
  width:290px;max-width:calc(100vw - 28px);
  max-height:calc(100vh - 130px);overflow-y:auto;
  background:#fff;border-radius:16px;
  box-shadow:0 10px 40px rgba(5,19,26,.25);
  padding:18px;display:none;
}
.panel.open{display:block}
.panel h4{font-size:13px;font-weight:700;margin-bottom:10px}
.panel .grp{margin-bottom:16px}
.panel .grp:last-child{margin-bottom:0}
.panel label{
  display:flex;align-items:flex-start;gap:9px;
  font-size:12.5px;line-height:1.4;padding:7px 8px;border-radius:10px;cursor:pointer;
}
.panel label:hover{background:#F3F6F9}
.panel input{accent-color:var(--blue);margin-top:2px;flex:none}
.panel label.sel{background:var(--accent-bg);font-weight:600}

/* ---------- v3: карточки как в приложении ---------- */
.recs .recs-head{margin-bottom:12px;gap:10px}
.recs-head h3{white-space:nowrap}
.recs-link{font-size:12px;flex:none}
.p-card{width:190px;padding:12px 12px 14px}
.p-img{
  height:132px;border-radius:12px;background:#F4F6F8;
  display:flex;align-items:center;justify-content:center;
}
.p-img svg{height:106px;width:auto}
.p-name{font-size:13.5px;font-weight:600;line-height:1.3;margin:11px 0 0;min-height:35px}
.p-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:6px}
.p-pricecol{min-width:0}
.p-price{font-size:15px;font-weight:700;line-height:1.2;margin:0;white-space:nowrap}
.p-caps{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.round-btn{
  width:34px;height:34px;border-radius:50%;flex:none;border:0;cursor:pointer;
  background:var(--blue);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s;
}
.round-btn:active{transform:scale(.9)}
.stepper-s{
  display:flex;align-items:center;justify-content:space-between;
  height:34px;width:82px;flex:none;
  border:1.5px solid #CFE5F2;border-radius:17px;background:#fff;
}
.stepper-s button{width:26px;height:100%;border:0;background:none;font-size:16px;font-weight:600;color:var(--blue);cursor:pointer}
.stepper-s span{flex:1;text-align:center;font-size:13px;font-weight:700}
.badge.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
/* ---------- лента вниз (крупные карточки) ---------- */
.recs-feed{padding-bottom:8px}
.feed{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f-card{
  background:#fff;border-radius:14px;padding:11px 11px 13px;
  display:flex;flex-direction:column;
}
.f-img{
  height:142px;border-radius:12px;background:#F4F6F8;
  display:flex;align-items:center;justify-content:center;margin-bottom:11px;
}
.f-img svg{height:120px;width:auto}
.f-name{font-size:13.5px;font-weight:600;line-height:1.25}
.f-desc{font-size:11.5px;line-height:1.4;color:#5c6d78;margin-top:5px;flex:1}
.f-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:11px}
.f-pricecol{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.f-price{font-size:15px;font-weight:700;white-space:nowrap}
.f-caps{font-size:10.5px;color:var(--muted);white-space:nowrap}
.feed-end{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:22px 0 8px;font-size:12.5px;color:var(--muted);
}
.spinner{
  width:15px;height:15px;border-radius:50%;flex:none;
  border:2px solid #CFE5F2;border-top-color:var(--blue);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.feed-done{text-align:center;padding:20px 0 6px;font-size:12.5px;color:var(--muted)}

.toast{
  position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:85;
  max-width:536px;margin:0 auto;
  background:linear-gradient(90deg,#7CC3E4,var(--blue));color:#fff;border-radius:18px;
  display:flex;align-items:center;gap:12px;
  padding:9px 9px 9px 16px;font-size:13px;font-weight:500;
  box-shadow:0 8px 26px rgba(16,152,212,.34);
  transform:translateY(16px);opacity:0;pointer-events:none;
  transition:transform .25s,opacity .25s;
}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .t-ic{display:flex;flex:none}
.toast .t-txt{flex:1;line-height:1.35}
.toast button{
  flex:none;border:0;cursor:pointer;white-space:nowrap;
  background:#fff;color:var(--dark);border-radius:22px;
  padding:11px 20px;font-size:13px;font-weight:600;
  transition:transform .12s;
}
.toast button:active{transform:scale(.96)}
</style>
</head>

<div class="wrap">

  <!-- ======= шапка + успех + детали ======= -->
  <section class="shell">
    <header class="hd">
      <div class="logo-chip"><svg viewBox="0 0 299.6 82.4" width="86"><use href="#wm"/></svg></div>
      <div class="hd-right">
        <button class="icon-btn" id="cartBtn" aria-label="Корзина">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 3h2l1.6 9.2a1.6 1.6 0 0 0 1.58 1.3h6.9a1.6 1.6 0 0 0 1.56-1.22L18.4 6H5.5" stroke="#05131A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="17" r="1.3" fill="#05131A"/><circle cx="14.6" cy="17" r="1.3" fill="#05131A"/></svg>
          <span class="badge" id="cartBadge" hidden>0</span>
        </button>
        <button class="icon-btn" aria-label="Меню">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 1h16M1 6h16M1 11h16" stroke="#05131A" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="success">
      <div class="s-check">
        <svg width="24" height="20" viewBox="0 0 24 20" fill="none"><path d="M2 10.5l7 7L22 2.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Заявка создана!</h1>
    </div>

    <div class="mailnote">
      <svg width="17" height="14" viewBox="0 0 17 14" fill="none"><rect x="1" y="1" width="15" height="12" rx="2.5" stroke="#1098D4" stroke-width="1.4"/><path d="M1.6 2.2l6.9 5 6.9-5" stroke="#1098D4" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Подтверждение с информацией о записи отправим на почту</span>
    </div>

    <div id="recsSlot"></div>

    <button class="lk-btn">В личный кабинет</button>

    <div id="recsSlotB"></div>
  </section>

  <!-- ======= промо ======= -->
  <section class="shell promo">
    <h2>Узнать больше о <svg viewBox="0 0 299.6 82.4" width="110"><use href="#wm"/></svg></h2>
    <div class="socials">
      <div class="soc"><svg width="20" height="18" viewBox="0 0 20 18" fill="none"><path d="M18.7 1.2L1.6 7.8c-.8.3-.8 1.4.05 1.7l4.3 1.4 1.6 5.1c.25.8 1.25 1 1.8.4l2.4-2.5 4.5 3.3c.7.5 1.7.1 1.9-.75L20 2.3c.2-.9-.6-1.5-1.3-1.1z" stroke="#05131A" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
      <div class="soc"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 1.8a8.2 8.2 0 0 0-7 12.4L2 18l3.9-1a8.2 8.2 0 1 0 4.1-15.2z" stroke="#05131A" stroke-width="1.3" stroke-linejoin="round"/><path d="M7.1 6.4c.4-.9 1.3-.9 1.6-.1l.5 1.2c.13.33.03.7-.25.95l-.55.5c.5 1.1 1.4 2 2.5 2.5l.5-.55c.25-.28.62-.38.95-.25l1.2.5c.8.3.8 1.2-.1 1.6-1 .45-2.2.4-3.3-.15a8.4 8.4 0 0 1-3.2-3.2c-.55-1.1-.6-2.3-.15-3z" stroke="#05131A" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
      <div class="soc"><span style="font-size:13px;font-weight:700;color:#05131A">VK</span></div>
      <div class="soc"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3.6 1.6c.6-.6 1.6-.5 2.1.2l1.5 2.1c.4.55.35 1.3-.1 1.8l-.8.9c.7 1.5 1.9 2.7 3.4 3.4l.9-.8c.5-.45 1.25-.5 1.8-.1l2.1 1.5c.7.5.8 1.5.2 2.1l-1 1c-.6.6-1.5.85-2.3.6-5-1.5-8.9-5.4-10.4-10.4-.25-.8 0-1.7.6-2.3l1-1z" stroke="#05131A" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
    </div>
  </section>
</div>

<!-- корзина (мок) -->
<div class="cart" id="cart" hidden>
  <div class="cart-inner">
    <button class="cart-back" id="cartBack">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M6 1L1 6l5 5M1 6h12" stroke="#1098D4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Вернуться
    </button>
    <h2>Корзина</h2>
    <div id="cartItems"></div>
    <div class="cart-sum">
      <h3>Сумма заказа</h3>
      <div class="cs-row"><span>Товары</span><span id="cartGoods">0 ₽</span></div>
      <div class="cs-row"><span>Доставка</span><span>Рассчитаем позже</span></div>
    </div>
    <div class="cart-total"><span>К оплате</span><b id="cartTotal">0 ₽</b></div>
    <button class="btn">Оформить заказ</button>
  </div>
</div>

<div class="toast" id="toast">
  <span class="t-ic">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="#fff" stroke-width="1.5"/><path d="M6.6 11.2l3 3 5.8-6.3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
  <span class="t-txt">Товар добавлен<br>в корзину</span>
  <button id="toastBtn">В корзину</button>
</div>
<!-- панель прототипа -->
<button class="fab" id="fab">Настройки прототипа</button>
<div class="panel" id="panel">
  <div class="grp">
    <h4>Формат витрины</h4>
    <div id="grpFormat"></div>
  </div>
  <div class="grp">
    <h4>Размещение блока</h4>
    <div id="grpPlace"></div>
  </div>
  <div class="grp">
    <h4>Состояние</h4>
    <div id="grpState"></div>
  </div>
</div>

<script>
const PRODUCTS = [
  {id:'sleep',  name:'Сон и спокойствие',  price:2890, caps:'60 капсул', desc:'Мелатонин и глицин для засыпания без разбитости.'},
  {id:'focus',  name:'Память и фокус',     price:1200, caps:'60 капсул', desc:'Гинкго и лецитин для концентрации.'},
  {id:'fem',    name:'Женское здоровье',   price:2950, caps:'60 капсул', desc:'Фолаты и железо для цикла и гемоглобина.'},
  {id:'male',   name:'Мужское здоровье',   price:2890, caps:'60 капсул', desc:'Цинк и селен для гормонального фона.'},
  {id:'heart',  name:'Забота о сердце',    price:2490, caps:'60 капсул', desc:'Коэнзим Q10 и калий для сосудов.'},
  {id:'immun',  name:'Иммунитет',          price:2390, caps:'60 капсул', desc:'Витамин D, цинк и селен для защиты в сезон простуд.'},
  {id:'energy', name:'Энергия и тонус',    price:2690, caps:'60 капсул', desc:'Витамины группы B и железо против упадка сил.'},
  {id:'beauty', name:'Красота и волосы',   price:3190, caps:'60 капсул', desc:'Коллаген и биотин для кожи, волос и ногтей.'},
  {id:'gut',    name:'Здоровье кишечника', price:2590, caps:'60 капсул', desc:'Пробиотики и клетчатка для пищеварения.'},
  {id:'joint',  name:'Суставы и связки',   price:2790, caps:'60 капсул', desc:'Глюкозамин и хондроитин для подвижности.'},
  {id:'detox',  name:'Детокс и печень',    price:2290, caps:'60 капсул', desc:'Расторопша и NAC для поддержки печени.'},
  {id:'omega',  name:'Омега-3',            price:1200, caps:'60 капсул', desc:'EPA и DHA для сердца, мозга и зрения.'},
  {id:'mg',     name:'Магний и B6',        price:1990, caps:'60 капсул', desc:'Снижает раздражительность и мышечные спазмы.'},
  {id:'skin',   name:'Чистая кожа',        price:2690, caps:'60 капсул', desc:'Цинк и витамин A против высыпаний.'},
  {id:'eyes',   name:'Зрение',             price:2390, caps:'60 капсул', desc:'Лютеин и зеаксантин при нагрузке на глаза.'},
  {id:'sport',  name:'Спорт и мышцы',      price:3090, caps:'60 капсул', desc:'Магний и аминокислоты для восстановления.'},
  {id:'thyro',  name:'Щитовидная железа',  price:2590, caps:'60 капсул', desc:'Йод и селен для обмена веществ.'},
  {id:'anti',   name:'Антиоксиданты',      price:2790, caps:'60 капсул', desc:'Ресвератрол и витамин C против стресса.'},
];
const CAROUSEL_COUNT = 5;
const FEED_START = 6;
const FEED_STEP  = 6;

const STATES = [
  {id:1, label:'Блок с товарами, корзина пуста'},
  {id:2, label:'Товар добавлен, подтверждение'},
  {id:3, label:'В корзине уже есть эта позиция'},
];
const PLACES = [
  {id:'A', label:'До кнопки «В личный кабинет» (по ТЗ)'},
  {id:'B', label:'После кнопки — идея для сравнения'},
];
const FORMATS = [
  {id:'car',  label:'Карусель — по ТЗ'},
  {id:'feed', label:'Лента вниз — бесконечная прокрутка, как в каталоге'},
];

let state = 1;
let place = 'A';
let format = 'car';
let feedShown = FEED_START;
let cart = {};            // id -> qty
let blockVisible = true;
let toastTimer = null;

const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
function plural(n, forms){
  return n%10===1 && n%100!==11 ? forms[0]
    : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20) ? forms[1] : forms[2]);
}
/* тёмная янтарная банка с серебристой крышкой — как реальные фото товара */
function bottleSVG(){
  return `<svg viewBox="0 0 64 84" fill="none">
    <rect x="19" y="4" width="26" height="11" rx="3" fill="#D5DADF"/>
    <rect x="19" y="4" width="26" height="4" rx="2" fill="#E9EDF0"/>
    <rect x="22" y="15" width="20" height="4" fill="#3B2B1F"/>
    <rect x="14" y="18" width="36" height="62" rx="9" fill="#4E3A2A"/>
    <rect x="18" y="23" width="5" height="52" rx="2.5" fill="#6B5340" opacity=".55"/>
    <rect x="14" y="36" width="36" height="27" fill="#221A13"/>
    <text x="32" y="52" text-anchor="middle" font-family="Montserrat,Arial" font-size="8.5" font-weight="600" fill="#fff">bioniq</text>
  </svg>`;
}

function cartCount(){ return Object.values(cart).reduce((s,q)=>s+q,0); }
function cartTotal(){
  return Object.entries(cart).reduce((s,[id,q])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    return s + p.price*q;
  },0);
}

/* ---------- витрина ---------- */
function render(){
  document.getElementById('recsSlot').innerHTML='';
  document.getElementById('recsSlotB').innerHTML='';
  if(blockVisible){
    const slot = document.getElementById(place==='A'?'recsSlot':'recsSlotB');
    slot.appendChild(buildRecs());
  }
  updateBadge();
}

function control(p){
  const q = cart[p.id]||0;
  return q===0
    ? `<button class="round-btn" data-add="${p.id}" aria-label="В корзину">
         <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2v11M2 7.5h11" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
       </button>`
    : `<div class="stepper-s" data-id="${p.id}">
         <button data-dec="${p.id}">−</button><span>${q}</span><button data-inc="${p.id}">+</button>
       </div>`;
}

function buildRecs(){
  const el = document.createElement('section');
  el.className = format==='feed' ? 'recs recs-feed' : 'recs';
  let html = `<div class="recs-head"><h3>Рекомендации к покупке</h3><a class="recs-link" href="#">Все витамины</a></div>`;

  if(format==='car'){
    html += `<div class="rail">`;
    for(const p of PRODUCTS.slice(0, CAROUSEL_COUNT)){
      html += `<div class="p-card">
        <div class="p-img">${bottleSVG()}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-row">
          <div class="p-pricecol"><div class="p-price">${fmt(p.price)}</div><div class="p-caps">${p.caps}</div></div>
          ${control(p)}
        </div>
      </div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="feed">`;
    for(const p of PRODUCTS.slice(0, feedShown)){
      html += `<div class="f-card">
        <div class="f-img">${bottleSVG()}</div>
        <div class="f-name">${p.name}</div>
        <div class="f-desc">${p.desc}</div>
        <div class="f-row">
          <div class="f-pricecol"><span class="f-price">${fmt(p.price)}</span><span class="f-caps">${p.caps}</span></div>
          ${control(p)}
        </div>
      </div>`;
    }
    html += `</div>`;
    html += feedShown < PRODUCTS.length
      ? `<div class="feed-end" id="feedEnd"><span class="spinner"></span>Загружаем ещё</div>`
      : `<div class="feed-done">Вы посмотрели все витамины</div>`;
  }
  el.innerHTML = html;

  el.querySelectorAll('[data-add]').forEach(b=>{
    b.addEventListener('click',()=>addToCart(b.dataset.add));
  });
  el.querySelectorAll('[data-inc]').forEach(b=>{
    b.addEventListener('click',()=>{ cart[b.dataset.inc]++; afterChange(b.dataset.inc,true); });
  });
  el.querySelectorAll('[data-dec]').forEach(b=>{
    b.addEventListener('click',()=>{
      const id = b.dataset.dec;
      cart[id]--;
      if(cart[id]<=0) delete cart[id];
      afterChange(id,false);
    });
  });
  return el;
}

/* подгружаем следующую порцию, когда низ ленты подходит к экрану */
function maybeLoadMore(){
  if(format!=='feed' || feedShown >= PRODUCTS.length) return;
  const end = document.getElementById('feedEnd');
  if(!end) return;
  if(end.getBoundingClientRect().top < window.innerHeight + 200){
    feedShown = Math.min(feedShown + FEED_STEP, PRODUCTS.length);
    render();
    requestAnimationFrame(maybeLoadMore);
  }
}
window.addEventListener('scroll', maybeLoadMore, {passive:true});
window.addEventListener('resize', maybeLoadMore);

function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  render();
  confirmAdd(id);
}
/* плюс-минус на степпере: без модалки, только бейдж и тост */
function afterChange(id, grew){
  render();
  popBadge();
  if(grew && cart[id]) showToast();
  if(!cart[id]) hideToast();
}
function confirmAdd(id){
  popBadge();
  showToast();
}

/* ---------- тост ---------- */
function showToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3500);
}
function hideToast(){
  document.getElementById('toast').classList.remove('show');
  clearTimeout(toastTimer);
}
document.getElementById('toastBtn').addEventListener('click', ()=>{ hideToast(); openCart(); });

/* ---------- бейдж и корзина ---------- */
function updateBadge(){
  const b = document.getElementById('cartBadge');
  const n = cartCount();
  b.hidden = n===0;
  b.textContent = n;
}
function popBadge(){
  const b = document.getElementById('cartBadge');
  b.classList.remove('pop');
  void b.offsetWidth;
  b.classList.add('pop');
}
function openCart(){
  hideToast();
  const wrap = document.getElementById('cartItems');
  const rows = Object.entries(cart).map(([id,q])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    return `<div class="cart-item">
      <div class="ci-im">${bottleSVG()}</div>
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-caps">${p.caps} на 30 дней</div>
        <span class="ci-src">Источник: успешный экран</span>
        <div class="ci-qty">${q} ${plural(q,['упаковка','упаковки','упаковок'])}${q>1?` × ${fmt(p.price)}`:''}</div>
      </div>
      <div class="ci-price">${fmt(p.price*q)}</div>
    </div>`;
  });
  wrap.innerHTML = rows.join('') || '<p style="color:#8CA0AC;font-size:13.5px">Корзина пуста</p>';
  document.getElementById('cartGoods').textContent = fmt(cartTotal());
  document.getElementById('cartTotal').textContent = fmt(cartTotal());
  document.getElementById('cart').hidden = false;
  document.body.style.overflow = 'hidden';
}
document.getElementById('cartBack').addEventListener('click', ()=>{
  document.getElementById('cart').hidden = true;
  document.body.style.overflow = '';
});
document.getElementById('cartBtn').addEventListener('click', openCart);

/* ---------- состояния ---------- */
function applyState(){
  cart = {};
  feedShown = FEED_START;
  blockVisible = true;
  hideToast();
  if(state===2){ cart = {focus:1}; }
  if(state===3){ cart = {sleep:1}; }
  render();
  if(state===2) confirmAdd('focus');
}

/* ---------- панель ---------- */
const fab = document.getElementById('fab');
const panel = document.getElementById('panel');
fab.addEventListener('click',()=>panel.classList.toggle('open'));

function radios(containerId, list, current, onPick){
  const c = document.getElementById(containerId);
  c.innerHTML='';
  for(const it of list){
    const l = document.createElement('label');
    if(String(it.id)===String(current)) l.className='sel';
    l.innerHTML = `<input type="radio" name="${containerId}" ${String(it.id)===String(current)?'checked':''}> ${it.label}`;
    l.querySelector('input').addEventListener('change',()=>onPick(it.id));
    c.appendChild(l);
  }
}
function renderPanel(){
  radios('grpFormat', FORMATS, format, id=>{
    format=id; feedShown=FEED_START; renderPanel(); render();
    requestAnimationFrame(maybeLoadMore);
  });
  radios('grpPlace', PLACES, place, id=>{place=id; renderPanel(); render();});
  radios('grpState', STATES, state, id=>{state=id; renderPanel(); applyState();});
}

/* init */
renderPanel();
applyState();
if(window.innerWidth>900) panel.classList.add('open');
</script>
</body>
</html>
